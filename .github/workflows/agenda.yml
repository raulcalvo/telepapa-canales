name: Actualizar agenda

on:
  schedule:
    # Cada 3 horas
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar agenda.json
        run: node tools/agenda_publica.js agenda.json

      - name: Publicar si ha cambiado
        run: |
          if git diff --quiet -- agenda.json && git ls-files --error-unmatch agenda.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Actualizar agenda"
          git push
