name: Actualizar partidos

on:
  schedule:
    # Cada 6 horas
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - derechos.json

permissions:
  contents: write

concurrency:
  group: partidos
  cancel-in-progress: false

jobs:
  partidos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar partidos.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node tools/partidos.js partidos.json

      - name: Publicar si ha cambiado
        run: |
          [ -f partidos.json ] || { echo "Sin partidos.json"; exit 0; }
          if git ls-files --error-unmatch partidos.json >/dev/null 2>&1 && git diff --quiet -- partidos.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add partidos.json
          git commit -m "Actualizar partidos"
          git push
